name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17 (Obrigatório para NDK Moderno)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependências essenciais do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          libtool \
          automake \
          autoconf \
          unzip \
          zip \
          zlib1g-dev

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" cython virtualenv

    - name: Gerar e Configurar o Buildozer.spec
      run: |
        MAIN_PATH=$(find . -name "main.py" -print -quit)
        
        if [ -z "$MAIN_PATH" ]; then
          echo "ERRO: O arquivo main.py não foi encontrado no repositório!"
          exit 1
        fi
        
        APP_DIR=$(dirname "$MAIN_PATH")
        cd "$APP_DIR"
        
        buildozer init
        
        # Configurações padrão do app
        sed -i 's/^requirements = .*/requirements = python3==3.11,kivy==2.3.0,kivymd,pyjnius/' buildozer.spec
        sed -i 's/^title = .*/title = Nossa Conveniencia/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = nossaconveniencia/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = org.rafaeldrones/' buildozer.spec
        
        # Ativa aceitação automática nativa no arquivo .spec
        sed -i 's/^#android.accept_apk_license = False/android.accept_apk_license = True/' buildozer.spec

    - name: Instalação Limpa e Forçada do Android SDK
      run: |
        # Deleta absolutamente qualquer rastro ou pasta fantasma para obrigar a reinstalação do zero
        rm -rf /home/runner/.buildozer/android
        
        # Cria a estrutura correta exigida pela Google
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        
        # Baixa diretamente as ferramentas oficiais de linha de comando atualizadas da Google
        cd /home/runner/.buildozer/android/platform/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
        unzip -q cmdline.zip
        
        # Move para a pasta interna 'latest' para o sdkmanager funcionar direito
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        rm cmdline.zip

        # Define o caminho do executável que acabamos de instalar
        SDKMANAGER="/home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager"
        
        # Força o 'yes' para assinar digitalmente TODAS as licenças da Google
        echo "Aceitando licenças do Android SDK de forma absoluta..."
        yes | $SDKMANAGER --sdk_root=/home/runner/.buildozer/android/platform/android-sdk --licenses

        # Instala obrigatoriamente as ferramentas que o Buildozer precisa (incluindo o aidl)
        echo "Instalando pacotes essenciais do SDK (Platform-tools e Build-tools 37)..."
        $SDKMANAGER --sdk_root=/home/runner/.buildozer/android/platform/android-sdk "platform-tools" "build-tools;37.0.0" "platforms;android-33"

    - name: Executar o Buildozer
      run: |
        MAIN_PATH=$(find . -name "main.py" -print -quit)
        APP_DIR=$(dirname "$MAIN_PATH")
        cd "$APP_DIR"
        
        # Agora o Buildozer vai encontrar o SDK com o sdkmanager e as licenças perfeitamente configuradas
        buildozer -v android debug
        
    - name: Upload do APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: pacote-apk-debug
        path: |
          **/bin/*.apk
