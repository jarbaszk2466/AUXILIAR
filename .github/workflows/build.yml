name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17 (Obrigatório para NDK Moderno)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependências essenciais do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          libtool \
          automake \
          autoconf \
          unzip \
          zip \
          zlib1g-dev

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" cython virtualenv

    - name: Gerar e Configurar o Buildozer.spec
      run: |
        MAIN_PATH=$(find . -name "main.py" -print -quit)
        
        if [ -z "$MAIN_PATH" ]; then
          echo "ERRO: O arquivo main.py não foi encontrado no repositório!"
          exit 1
        fi
        
        APP_DIR=$(dirname "$MAIN_PATH")
        cd "$APP_DIR"
        
        buildozer init
        
        # Configurações do seu app
        sed -i 's/^requirements = .*/requirements = python3==3.11,kivy==2.3.0,kivymd,pyjnius/' buildozer.spec
        sed -i 's/^title = .*/title = Nossa Conveniencia/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = nossaconveniencia/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = org.rafaeldrones/' buildozer.spec
        
        # Ativa a flag nativa do spec para aceitar licenças
        sed -i 's/^#android.accept_apk_license = False/android.accept_apk_license = True/' buildozer.spec

    - name: Montar Ambiente Android SDK Perfeito (Com Link Simbólico)
      run: |
        # Limpa o terreno de builds anteriores
        rm -rf /home/runner/.buildozer/android
        
        # Cria a árvore exata que o Buildozer quer ver
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/tools/bin
        
        # Baixa as ferramentas oficiais da Google
        cd /home/runner/.buildozer/android/platform/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
        unzip -q cmdline.zip
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        rm cmdline.zip

        # Cria os links simbólicos (atalhos) para enganar o Buildozer legado
        # Sempre que ele procurar em 'tools/bin', vai rodar o nosso 'cmdline-tools' atualizado
        ln -s /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        ln -s /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/avdmanager /home/runner/.buildozer/android/platform/android-sdk/tools/bin/avdmanager

        # Define o caminho do executável ativo
        SDKMANAGER="/home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager"
        
        # Aceita todas as licenças na marra
        echo "Aceitando licenças do Android de forma absoluta..."
        yes | $SDKMANAGER --sdk_root=/home/runner/.buildozer/android/platform/android-sdk --licenses

        # Pré-instala as ferramentas de compilação essenciais
        echo "Instalando platform-tools e build-tools 37..."
        $SDKMANAGER --sdk_root=/home/runner/.buildozer/android/platform/android-sdk "platform-tools" "build-tools;37.0.0" "platforms;android-33"

    - name: Executar o Buildozer
      run: |
        MAIN_PATH=$(find . -name "main.py" -print -quit)
        APP_DIR=$(dirname "$MAIN_PATH")
        cd "$APP_DIR"
        
        # Executa o build final. Agora todos os arquivos e atalhos estão no lugar certo!
        buildozer -v android debug
        
    - name: Upload do APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: pacote-apk-debug
        path: |
          **/bin/*.apk
