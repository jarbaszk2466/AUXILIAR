name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Instalar dependências do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          libtool \
          automake \
          autoconf \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Localizar e Executar o Buildozer
      run: |
        # Encontra a pasta que contém o buildozer.spec
        SPEC_PATH=$(find . -name "buildozer.spec" -print -quit)
        
        if [ -z "$SPEC_PATH" ]; then
          echo "ERRO: O arquivo buildozer.spec não foi encontrado em NENHUM lugar do repositório!"
          exit 1
        fi
        
        # Extrai o diretório do arquivo
        SPEC_DIR=$(dirname "$SPEC_PATH")
        echo "Sucesso! Arquivo de configuração encontrado na pasta: $SPEC_DIR"
        
        # Entra na pasta correta e roda o build
        cd "$SPEC_DIR"
        buildozer -v android debug

    - name: Upload do APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: pacote-apk-debug
        path: |
          **/bin/*.apk
