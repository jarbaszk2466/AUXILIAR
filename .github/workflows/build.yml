name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permite rodar o build manualmente pelo botão no GitHub

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Cache do Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          NossaConveniencia/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('NossaConveniencia/buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Instalar dependências do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          libtool \
          automake \
          autoconf \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Executar o Buildozer
      working-directory: ./NossaConveniencia
      run: |
        buildozer -v android debug

    - name: Upload do APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: pacote-apk-debug
        path: NossaConveniencia/bin/*.apk
