name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17 (Obrigatório para NDK Moderno)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependências do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          libtool \
          automake \
          autoconf \
          unzip \
          zip \
          zlib1g-dev

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" cython virtualenv

    - name: Gerar e Configurar o Buildozer.spec
      run: |
        MAIN_PATH=$(find . -name "main.py" -print -quit)
        
        if [ -z "$MAIN_PATH" ]; then
          echo "ERRO: O arquivo main.py não foi encontrado no repositório!"
          exit 1
        fi
        
        APP_DIR=$(dirname "$MAIN_PATH")
        cd "$APP_DIR"
        
        buildozer init
        
        # Define os requerimentos estáveis
        sed -i 's/^requirements = .*/requirements = python3==3.11,kivy==2.3.0,kivymd,pyjnius/' buildozer.spec
        sed -i 's/^title = .*/title = Nossa Conveniencia/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = nossaconveniencia/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = org.rafaeldrones/' buildozer.spec
        
        # Ativa a flag nativa de aceitação nas configurações
        sed -i 's/^#android.accept_apk_license = False/android.accept_apk_license = True/' buildozer.spec

    - name: Pré-instalação e Aceitação Forçada de Licenças
      run: |
        # Força o Buildozer a baixar a estrutura inicial do Android SDK/NDK antes do build principal
        # Usamos o comando 'help' apenas para disparar o download das ferramentas de linha de comando
        buildozer android help || true
        
        # Encontra o executável oficial do sdkmanager que acabou de ser baixado
        SDK_MANAGER=$(find /home/runner/.buildozer/ -name "sdkmanager" -type f -print -quit)
        
        if [ -n "$SDK_MANAGER" ]; then
          echo "Gerenciador do SDK encontrado em: $SDK_MANAGER"
          echo "Aceitando todas as licenças pendentes (incluindo Build-Tools 37)..."
          # Injeta 'yes' repetidamente direto no prompt oficial do sdkmanager
          yes | $SDK_MANAGER --licenses || true
        else
          echo "Aviso: sdkmanager ainda não disponível, o Buildozer cuidará disso com a flag interna."
        fi

    - name: Executar o Buildozer
      run: |
        MAIN_PATH=$(find . -name "main.py" -print -quit)
        APP_DIR=$(dirname "$MAIN_PATH")
        cd "$APP_DIR"
        
        # Roda o build final de forma limpa e contínua
        buildozer -v android debug
        
    - name: Upload do APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: pacote-apk-debug
        path: |
          **/bin/*.apk
