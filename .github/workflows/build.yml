name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17 (Obrigatório para ferramentas modernas)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar dependências essenciais do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          libtool \
          automake \
          autoconf \
          unzip \
          zip \
          zlib1g-dev

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" cython virtualenv

    - name: Gerar e Configurar o Buildozer.spec
      run: |
        MAIN_PATH=$(find . -name "main.py" -print -quit)
        
        if [ -z "$MAIN_PATH" ]; then
          echo "ERRO: O arquivo main.py não foi encontrado!"
          exit 1
        fi
        
        APP_DIR=$(dirname "$MAIN_PATH")
        cd "$APP_DIR"
        
        buildozer init
        
        # Injeta os requerimentos e configurações do app
        sed -i 's/^requirements = .*/requirements = python3==3.11,kivy==2.3.0,kivymd,pyjnius/' buildozer.spec
        sed -i 's/^title = .*/title = Nossa Conveniencia/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = nossaconveniencia/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = org.rafaeldrones/' buildozer.spec
        
        # Ativa a flag nativa do próprio arquivo spec para aceitar licenças
        sed -i 's/^#android.accept_apk_license = False/android.accept_apk_license = True/' buildozer.spec

    - name: Instalação Manual e Forçada dos Componentes do Android
      run: |
        # 1. Força a criação das pastas oficiais do Buildozer
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
        
        # 2. Baixa a ferramenta oficial estável do Google (Command Line Tools)
        cd /home/runner/.buildozer/android/platform/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
        unzip -q cmdline.zip
        
        # Organiza os arquivos no padrão que o ecossistema exige
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        rm cmdline.zip

        # 3. Define o caminho do executável estável do sdkmanager
        SDKMANAGER="/home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager"
        
        # 4. Aceita TODAS as licenças de uma vez usando o "yes" antes de qualquer outra coisa
        echo "Aceitando licenças de forma absoluta..."
        yes | $SDKMANAGER --sdk_root=/home/runner/.buildozer/android/platform/android-sdk --licenses

        # 5. Instala na marra as ferramentas essenciais (Build-tools 37 e Platform-tools) que continham o 'aidl'
        echo "Instalando antecipadamente as ferramentas de compilação..."
        $SDKMANAGER --sdk_root=/home/runner/.buildozer/android/platform/android-sdk "platform-tools" "build-tools;37.0.0" "platforms;android-33"

    - name: Executar o Buildozer
      run: |
        MAIN_PATH=$(find . -name "main.py" -print -quit)
        APP_DIR=$(dirname "$MAIN_PATH")
        cd "$APP_DIR"
        
        # O ambiente agora já tem tudo instalado e licenciado na raiz, o buildozer vai ler direto
        buildozer -v android debug
        
    - name: Upload do APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: pacote-apk-debug
        path: |
          **/bin/*.apk
