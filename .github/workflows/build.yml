name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Instalar dependências do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          libtool \
          automake \
          autoconf \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Gerar e Configurar o Buildozer.spec
      run: |
        MAIN_PATH=$(find . -name "main.py" -print -quit)
        
        if [ -z "$MAIN_PATH" ]; then
          echo "ERRO: O arquivo main.py não foi encontrado no repositório!"
          exit 1
        fi
        
        APP_DIR=$(dirname "$MAIN_PATH")
        cd "$APP_DIR"
        
        # Inicia o spec
        buildozer init
        
        # Força os requerimentos corretos com Python estável
        sed -i 's/^requirements = .*/requirements = python3==3.11,kivy==2.3.0,kivymd,pyjnius/' buildozer.spec
        sed -i 's/^title = .*/title = Nossa Conveniencia/' buildozer.spec
        sed -i 's/^package.name = .*/package.name = nossaconveniencia/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = org.rafaeldrones/' buildozer.spec

    - name: Executar o Buildozer (Aceitando Termos)
      run: |
        MAIN_PATH=$(find . -name "main.py" -print -quit)
        APP_DIR=$(dirname "$MAIN_PATH")
        cd "$APP_DIR"
        
        # Esta variável de ambiente avisa o gerenciador do Android para aceitar tudo silenciosamente
        export ANDROID_Licenses_Flags="--accept-licenses"
        
        # O 'yes' agora interage direto com qualquer prompt clássico que surgir
        yes | buildozer -v android debug
