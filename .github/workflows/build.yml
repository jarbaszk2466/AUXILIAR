name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Instalar dependências do sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          libtool \
          automake \
          autoconf \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Buildozer e Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Gerar e Configurar o Buildozer.spec
      run: |
        # Localiza a pasta onde está o main.py do seu app
        MAIN_PATH=$(find . -name "main.py" -print -quit)
        
        if [ -z "$MAIN_PATH" ]; then
          echo "ERRO: O arquivo main.py não foi encontrado no repositório! Certifique-se de que o nome está correto."
          exit 1
        fi
        
        APP_DIR=$(dirname "$MAIN_PATH")
        echo "Aplicativo encontrado na pasta: $APP_DIR"
        cd "$APP_DIR"
        
        # Cria um arquivo buildozer.spec padrão novo limpo
        buildozer init
        
        # Ajusta as configurações cruciais para não dar erro
        # 1. Altera os requerimentos para incluir python3==3.11, kivy, kivymd e pyjnius
        sed -i 's/^requirements = .*/requirements = python3==3.11,kivy==2.3.0,kivymd,pyjnius/' buildozer.spec
        
        # 2. Define o nome do aplicativo baseado no seu projeto
        sed -i 's/^title = .*/title = Nossa Conveniencia/' buildozer.spec
        
        # 3. Define o pacote (package.domain)
        sed -i 's/^package.name = .*/package.name = nossaconveniencia/' buildozer.spec
        sed -i 's/^package.domain = .*/package.domain = org.rafaeldrones/' buildozer.spec
        
        echo "Arquivo buildozer.spec criado e configurado com sucesso!"

    - name: Executar o Buildozer
      run: |
        MAIN_PATH=$(find . -name "main.py" -print -quit)
        APP_DIR=$(dirname "$MAIN_PATH")
        cd "$APP_DIR"
        
        # Roda o build sem travar pedindo root
        buildozer -v android debug

    - name: Upload do APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: pacote-apk-debug
        path: |
          **/bin/*.apk
